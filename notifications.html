<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — Heroscape France</title><link rel="stylesheet" href="css/style.css?v=20261009-43"><link rel="stylesheet" href="css/forum-background.css?v=20261016-mobilelogo1"></head><body><header><div class="container"><div class="brand home-brand"><img class="heroscape-main-logo" src="Logo%20Heroscape%20_%20bataille%20%C3%A9ternelle.png" alt="Heroscape"></div><nav><a href="index.html?v=20261013-nav10">Forum</a><a href="cartes-armee.html">Cartes Armées</a><a href="regles.html">Règles</a><a href="liens-utiles.html">Liens utiles</a><a href="membres.html">Membres</a><a href="pari-heroscape.html">Le Pari Heroscape</a></nav></div></header><main class="container"><section class="hero"><h2>🔔 Notifications</h2><p>Les nouvelles activités qui te concernent apparaîtront ici.</p></section><section class="card" style="margin-bottom:16px"><h3>Notifications du Pari Heroscape</h3><label style="display:flex;align-items:center;gap:10px"><input id="bet-notifications-toggle" type="checkbox"> Recevoir les notifications des nouvelles parties</label><p id="bet-notifications-status" aria-live="polite"></p></section><div id="notifications-list" class="card"><p>Chargement…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/forum-background.js?v=20261013-refresh9"></script><script src="js/forum-topbar.js?v=20261015-readaction2"></script><script src="js/forum.js?v=20261013-fastaccount12"></script><script>(async()=>{
 const db=window.supabaseClient,b=document.getElementById("notifications-list"),toggle=document.getElementById("bet-notifications-toggle"),status=document.getElementById("bet-notifications-status");
 const {data:{user}}=await db.auth.getUser();if(!user){location.href="connexion.html";return}
 const {data:pref,error:prefError}=await db.from("profiles").select("bet_notifications_enabled").eq("id",user.id).single();
 if(prefError){toggle.disabled=true;status.textContent="Impossible de charger la préférence."}
 else{
  toggle.checked=pref.bet_notifications_enabled!==false;
  toggle.addEventListener("change",async()=>{const enabled=toggle.checked;toggle.disabled=true;status.textContent="Enregistrement…";const {error}=await db.from("profiles").update({bet_notifications_enabled:enabled}).eq("id",user.id);if(error){toggle.checked=!enabled;status.textContent="Erreur : "+error.message}else status.textContent=enabled?"Notifications du Pari Heroscape activées.":"Notifications du Pari Heroscape désactivées.";toggle.disabled=false});
 }
 const {data,error}=await db.from("notifications").select("id,content,created_at,is_read,link").eq("user_id",user.id).order("created_at",{ascending:false});
 if(error){b.innerHTML="<p>Impossible de charger les notifications.</p>";return}
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 b.innerHTML=data.length?data.map(n=>{const link=n.link&&/^pari-heroscape\.html\?match=\d+#(?:terminees|encours)$/.test(n.link);return '<div class="notification-row" style="padding:10px 0;border-bottom:1px solid #46505b">'+(n.is_read?'':'<strong style="color:#e8ba53">● Nouvelle notification</strong>')+'<p>'+(link?'<a href="'+esc(n.link)+'">':'')+esc(n.content)+(link?'</a>':'')+'</p><small>'+new Date(n.created_at).toLocaleString("fr-FR")+'</small></div>'}).join(""):"<p>Aucune notification pour le moment.</p>";
 const unread=data.filter(n=>!n.is_read).map(n=>n.id);
 if(unread.length){const {error:readError}=await db.from("notifications").update({is_read:true}).eq("user_id",user.id).in("id",unread);if(readError)console.error("Lecture des notifications :",readError)}
})();</script><footer><div class="container">Heroscape France — communauté francophone Heroscape.</div></footer></body></html>

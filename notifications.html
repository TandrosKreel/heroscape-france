<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — Heroscape France</title><link rel="stylesheet" href="css/style.css?v=20261006-37"></head><body><header><div class="container"><div class="brand home-brand"><img class="heroscape-main-logo" src="Logo%20Heroscape%20_%20bataille%20%C3%A9ternelle.png" alt="Heroscape"><div class="tag">Forum & archives francophones</div></div><nav><a href="index.html">Forum</a><a href="cartes-armee.html">Cartes Armées</a><a href="regles.html">Règles</a><a href="liens-utiles.html">Liens utiles</a><a href="membres.html">Membres</a></nav></div></header><main class="container"><section class="hero"><h2>🔔 Notifications</h2><p>Les nouvelles activités qui te concernent apparaîtront ici.</p></section><div id="notifications-list" class="card"><p>Chargement…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/forum.js?v=20261006-36"></script><script>(async()=>{const b=document.getElementById("notifications-list");const {data:{user}}=await window.supabaseClient.auth.getUser();if(!user){location.href="connexion.html";return}const {data,error}=await window.supabaseClient.from("notifications").select("id,content,created_at,is_read,link").eq("user_id",user.id).order("created_at",{ascending:false});if(error){b.innerHTML="<p>Les notifications seront disponibles dès que leur table Supabase sera activée.</p>";return}b.innerHTML=data.length?data.map(n=>"<div class='notification-row'><p>"+String(n.content).replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))+"</p></div>").join(""):"<p>Aucune notification pour le moment.</p>";})();</script><footer><div class="container">Heroscape France — communauté francophone Heroscape.</div></footer></body></html>

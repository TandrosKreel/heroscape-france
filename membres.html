<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Membres — Heroscape France</title><link rel="stylesheet" href="css/style.css?v=20261009-43">
<link rel="stylesheet" href="css/forum-background.css?v=20261015-gueststicky4"></head>
<body><header><div class="container"><div class="brand home-brand">
      <img class="heroscape-main-logo" src="Logo%20Heroscape%20_%20bataille%20%C3%A9ternelle.png" alt="Heroscape">
      
    </div>
<nav><a href="index.html">Forum</a><a href="cartes-armee.html">Cartes Armées</a><a href="regles.html">Règles</a><a href="liens-utiles.html">Liens utiles</a><a class="active" href="membres.html">Membres</a></nav></div></header>
<main class="container"><section class="hero"><h2>👥 Membres du forum</h2><p>Les membres sont classés selon leur nombre total de messages publiés.</p></section>
<div id="admin-member-tabs" style="display:none;gap:8px;flex-wrap:wrap;margin:0 0 16px"><button class="btn" type="button" id="tab-active-members" aria-pressed="true">Membres actifs</button><button class="btn" type="button" id="tab-deleted-members" aria-pressed="false">Comptes supprimés</button></div>
<section id="members-list" class="members-list"><div class="empty">Chargement des membres…</div></section>
<section id="deleted-members-list" class="members-list" style="display:none"></section></main>
<footer><div class="container">Heroscape France — communauté francophone Heroscape.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/forum-background.js?v=20261015-allpages"></script><script src="js/forum-topbar.js?v=20261015-readaction2"></script><script src="js/forum.js?v=20261013-fastaccount12"></script>
<script>
(async()=>{
 const box=document.getElementById("members-list");
 const user=await getCurrentUser();
 if(!user){
   box.innerHTML='<div class="card"><h3>🔒 Liste réservée aux membres</h3><p>La liste des membres du forum est accessible uniquement aux membres connectés.</p><p><a class="btn" href="connexion.html">Connexion / Créer un compte</a></p></div>';
   return;
 }
 const currentProfile=await getCurrentProfile();
 const isAdmin=currentProfile?.role==="admin";
 if(isAdmin){
   const tabs=document.getElementById("admin-member-tabs");
   const activeTab=document.getElementById("tab-active-members");
   const deletedTab=document.getElementById("tab-deleted-members");
   const deletedBox=document.getElementById("deleted-members-list");
   tabs.style.display="flex";
   let deletedLoaded=false;
   async function loadDeletedMembers(){
     deletedBox.innerHTML='<div class="empty">Chargement des comptes supprimés…</div>';
     const {data,error}=await window.supabaseClient.rpc("admin_list_deleted_forum_members");
     if(error){deletedBox.innerHTML='<div class="empty">Impossible de charger les comptes supprimés : '+esc(error.message)+'</div>';return;}
     deletedLoaded=true;
     if(!data?.length){deletedBox.innerHTML='<div class="empty">Aucun compte supprimé enregistré depuis la mise en place de cet historique.</div>';return;}
     deletedBox.innerHTML=data.map(m=>{
       const date=new Date(m.deleted_at).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});
       const count=Number(m.remaining_posts)||0;
       return '<div class="card member-row"><div class="member-info"><strong>'+esc(m.username)+'</strong><div class="count">Compte supprimé le '+esc(date)+' — '+count+' message'+(count>1?'s':'')+' conservé'+(count>1?'s':'')+'</div></div>'+
         (m.messages_preserved?'<button class="btn admin-purge-deleted" type="button" data-member-id="'+esc(m.id)+'" data-member-name="'+esc(m.username)+'">Supprimer ses messages</button>':'<span class="count">Messages déjà supprimés</span>')+'</div>';
     }).join("");
     deletedBox.querySelectorAll(".admin-purge-deleted").forEach(button=>button.addEventListener("click",async()=>{
       const name=button.dataset.memberName;
       if(!confirm('Supprimer les messages conservés de « '+name+' » ? Les premiers messages des sujets ayant des réponses d’autres membres resteront anonymisés. Cette action est irréversible.'))return;
       button.disabled=true;
       const {error}=await window.supabaseClient.rpc("admin_purge_deleted_forum_member_messages",{p_member_id:button.dataset.memberId});
       if(error){alert("Suppression impossible : "+error.message);button.disabled=false;return;}
       await loadDeletedMembers();
     }));
   }
   activeTab.addEventListener("click",()=>{
     box.style.display="";deletedBox.style.display="none";
     activeTab.setAttribute("aria-pressed","true");deletedTab.setAttribute("aria-pressed","false");
   });
   deletedTab.addEventListener("click",async()=>{
     box.style.display="none";deletedBox.style.display="";
     activeTab.setAttribute("aria-pressed","false");deletedTab.setAttribute("aria-pressed","true");
     if(!deletedLoaded)await loadDeletedMembers();
   });
 }
 const [{data:profiles,error:pe},counts]=await Promise.all([
   window.supabaseClient.from("profiles").select("id,username,avatar_url,role,created_at"),
   getMessageCounts()
 ]);
 if(pe){console.error(pe);box.innerHTML='<div class="empty">Impossible de charger la liste des membres.</div>';return;}
 const members=(profiles||[]).map(p=>({...p,message_count:counts[p.id]||0}))
   .sort((a,b)=>b.message_count-a.message_count||String(a.username).localeCompare(String(b.username),"fr"));
 if(!members.length){box.innerHTML='<div class="empty">Aucun membre pour le moment.</div>';return;}
 box.innerHTML=members.map((m,i)=>{
   const avatar=m.avatar_url?'<img class="member-avatar" src="'+esc(m.avatar_url)+'" alt="" loading="lazy">':'<div class="member-avatar post-avatar-default">'+esc((m.username||"M").charAt(0).toUpperCase())+'</div>';
   return '<div class="card member-row"><div class="member-rank">'+(i+1)+'</div>'+avatar+'<div class="member-info"><strong>'+esc(m.username||"Membre")+'</strong><div class="count">'+m.message_count+' message'+(m.message_count>1?'s':'')+'</div></div><a class="btn member-message-btn" href="messages.html?to='+encodeURIComponent(m.id)+'">✉ Envoyer un message</a>'+(isAdmin&&m.id!==currentProfile.id?'<button class="btn admin-delete-member" type="button" data-member-id="'+m.id+'" data-member-name="'+esc(m.username||"Membre")+'" data-keep-messages="false">Supprimer profil et messages</button><button class="btn admin-delete-member" type="button" data-member-id="'+m.id+'" data-member-name="'+esc(m.username||"Membre")+'" data-keep-messages="true">Supprimer profil, conserver messages</button>':'')+'</div>';
 }).join("");
 if(isAdmin){
   box.querySelectorAll(".admin-delete-member").forEach(button=>button.addEventListener("click",async()=>{
     const keepMessages=button.dataset.keepMessages==="true";
     const memberName=button.dataset.memberName;
     const confirmation=keepMessages
       ? 'Supprimer définitivement le compte de « '+memberName+' » ? Tous ses sujets et messages publics seront conservés sous « Membre supprimé ». Ses messages privés seront supprimés.'
       : 'Supprimer définitivement le compte de « '+memberName+' » et ses messages ? Seuls les premiers messages de ses sujets ayant reçu des réponses d’autres membres seront conservés sous « Membre supprimé ».';
     if(!confirm(confirmation))return;
     box.querySelectorAll('.admin-delete-member').forEach(b=>b.disabled=true);
     const rpcName=keepMessages?"admin_delete_forum_member_keep_messages":"admin_delete_forum_member";
     const {error}=await window.supabaseClient.rpc(rpcName,{p_user_id:button.dataset.memberId});
     if(error){alert("Suppression impossible : "+error.message);box.querySelectorAll('.admin-delete-member').forEach(b=>b.disabled=false);return;}
     location.reload();
   }));
 }
})();
</script></body></html>

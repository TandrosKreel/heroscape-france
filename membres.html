<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Membres — Heroscape France</title><link rel="stylesheet" href="css/style.css?v=20261006-37"></head>
<body><header><div class="container"><div class="brand home-brand">
      <img class="heroscape-main-logo" src="Logo%20Heroscape%20_%20bataille%20%C3%A9ternelle.png" alt="Heroscape">
      <div class="tag">Forum & archives francophones</div>
    </div>
<nav><a href="index.html">Forum</a><a href="cartes-armee.html">Cartes Armées</a><a href="regles.html">Règles</a><a href="liens-utiles.html">Liens utiles</a><a class="active" href="membres.html">Membres</a></nav></div></header>
<main class="container"><section class="hero"><h2>👥 Membres du forum</h2><p>Les membres sont classés selon leur nombre total de messages publiés.</p></section>
<section id="members-list" class="members-list"><div class="empty">Chargement des membres…</div></section></main>
<footer><div class="container">Heroscape France — communauté francophone Heroscape.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/forum.js?v=20261006-34"></script>
<script>
(async()=>{
 const box=document.getElementById("members-list");
 const user=await getCurrentUser();
 if(!user){
   box.innerHTML='<div class="card"><h3>🔒 Liste réservée aux membres</h3><p>La liste des membres du forum est accessible uniquement aux membres connectés.</p><p><a class="btn" href="connexion.html">Connexion / Créer un compte</a></p></div>';
   return;
 }
 const currentProfile=await getCurrentProfile();
 const isAdmin=currentProfile?.role==="admin";
 const [{data:profiles,error:pe},{data:posts,error:po}]=await Promise.all([
   window.supabaseClient.from("profiles").select("id,username,avatar_url,role,created_at"),
   window.supabaseClient.from("posts").select("user_id")
 ]);
 if(pe||po){console.error(pe||po);box.innerHTML='<div class="empty">Impossible de charger la liste des membres.</div>';return;}
 const counts={}; (posts||[]).forEach(p=>counts[p.user_id]=(counts[p.user_id]||0)+1);
 const members=(profiles||[]).map(p=>({...p,message_count:counts[p.id]||0}))
   .sort((a,b)=>b.message_count-a.message_count||String(a.username).localeCompare(String(b.username),"fr"));
 if(!members.length){box.innerHTML='<div class="empty">Aucun membre pour le moment.</div>';return;}
 box.innerHTML=members.map((m,i)=>{
   const avatar=m.avatar_url?'<img class="member-avatar" src="'+esc(m.avatar_url)+'" alt="" loading="lazy">':'<div class="member-avatar post-avatar-default">'+esc((m.username||"M").charAt(0).toUpperCase())+'</div>';
   return '<div class="card member-row"><div class="member-rank">'+(i+1)+'</div>'+avatar+'<div class="member-info"><strong>'+esc(m.username||"Membre")+'</strong><div class="count">'+m.message_count+' message'+(m.message_count>1?'s':'')+'</div></div><a class="btn member-message-btn" href="messages.html?to='+encodeURIComponent(m.id)+'">✉ Envoyer un message</a>'+(isAdmin&&m.id!==currentProfile.id?'<button class="btn admin-delete-member" type="button" data-member-id="'+m.id+'" data-member-name="'+esc(m.username||"Membre")+'">Supprimer le profil</button>':'')+'</div>';
 }).join("");
 if(isAdmin){
   box.querySelectorAll(".admin-delete-member").forEach(button=>button.addEventListener("click",async()=>{
     if(!confirm("Êtes-vous sûr de vouloir supprimer ce profil ?"))return;
     button.disabled=true;
     const {error}=await window.supabaseClient.rpc("admin_delete_forum_member",{p_user_id:button.dataset.memberId});
     if(error){alert("Suppression impossible : "+error.message);button.disabled=false;return;}
     location.reload();
   }));
 }
})();
</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages privés — Heroscape France</title><link rel="stylesheet" href="css/style.css?v=20261006-37"></head><body>
<header><div class="container"><div class="brand home-brand">
      <img class="heroscape-main-logo" src="Logo%20Heroscape%20_%20bataille%20%C3%A9ternelle.png" alt="Heroscape">
      <div class="tag">Forum & archives francophones</div>
    </div><nav><a href="index.html">Forum</a><a href="cartes-armee.html">Cartes Armées</a><a href="regles.html">Règles</a><a href="liens-utiles.html">Liens utiles</a><a href="membres.html">Membres</a></nav></div></header>
<main class="container">
<section class="hero"><h2>✉ Messages privés</h2><p>Messages reçus et envoyés. Capacité maximale : 20 messages par boîte.</p></section>
<section id="compose" class="card" hidden><h3 id="compose-title">Nouveau message</h3><textarea id="pm-content" rows="6" maxlength="5000" placeholder="Écris ton message…" style="width:100%;box-sizing:border-box"></textarea><p><button class="btn" id="send-pm" type="button">Envoyer</button> <a href="membres.html">Annuler</a></p><p id="pm-status"></p></section>
<section class="pm-toolbar card"><strong id="pm-counter">Chargement…</strong><span id="pm-warning"></span></section>
<section class="pm-tabs"><button class="btn active" id="tab-received" type="button">Reçus</button><button class="btn" id="tab-sent" type="button">Envoyés</button></section>
<div id="private-messages" class="card"><p>Chargement…</p></div>
</main><footer><div class="container">Heroscape France — communauté francophone Heroscape.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/forum.js?v=20261006-35"></script>
<script>
(async()=>{
 const sb=window.supabaseClient,box=document.getElementById("private-messages"),counter=document.getElementById("pm-counter"),warning=document.getElementById("pm-warning");
 const {data:{user}}=await sb.auth.getUser();if(!user){location.href="connexion.html";return}
 let all=[],profiles={},view="received";
 const escPm=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 async function load(){
   const {data,error}=await sb.from("private_messages").select("id,sender_id,recipient_id,content,created_at,is_read,sender_deleted,recipient_deleted").or("sender_id.eq."+user.id+",recipient_id.eq."+user.id).order("created_at",{ascending:false});
   if(error){box.innerHTML="<p>Impossible de charger les messages : "+escPm(error.message)+"</p>";return}
   all=data||[];
   const unreadIds=all.filter(m=>m.recipient_id===user.id&&!m.recipient_deleted&&!m.is_read).map(m=>m.id);
   if(unreadIds.length){
     const {error:readError}=await sb.from("private_messages").update({is_read:true}).in("id",unreadIds);
     if(!readError) all.forEach(m=>{if(unreadIds.includes(m.id))m.is_read=true});
   }
   const ids=[...new Set(all.flatMap(m=>[m.sender_id,m.recipient_id]))];
   if(ids.length){const {data:ps}=await sb.from("profiles").select("id,username,avatar_url").in("id",ids);profiles={};(ps||[]).forEach(p=>profiles[p.id]=p)}
   const received=all.filter(m=>m.recipient_id===user.id&&!m.recipient_deleted),sent=all.filter(m=>m.sender_id===user.id&&!m.sender_deleted);
   counter.textContent="Boîte : "+received.length+" / 20 reçus • "+sent.length+" / 20 envoyés";
   warning.textContent=received.length>=20?" ⚠ Boîte de réception pleine : supprime un message pour en recevoir un nouveau.":"";
   render();
 }
 function render(){
   const rows=all.filter(m=>view==="received"?(m.recipient_id===user.id&&!m.recipient_deleted):(m.sender_id===user.id&&!m.sender_deleted));
   document.getElementById("tab-received").classList.toggle("active",view==="received");
   document.getElementById("tab-sent").classList.toggle("active",view==="sent");
   if(!rows.length){box.innerHTML="<p>Aucun message "+(view==="received"?"reçu":"envoyé")+" pour le moment.</p>";return}
   box.innerHTML=rows.map(m=>{
     const other=profiles[view==="received"?m.sender_id:m.recipient_id]||{},date=new Intl.DateTimeFormat("fr-FR",{dateStyle:"short",timeStyle:"short"}).format(new Date(m.created_at));
     const av=other.avatar_url?'<img class="pm-avatar" src="'+escPm(other.avatar_url)+'" alt="">':'<span class="pm-avatar pm-avatar-default">'+escPm((other.username||"M").charAt(0))+'</span>';
     return '<article class="pm-row">'+av+'<div class="pm-body"><div class="pm-meta"><strong>'+(view==="received"?"De ":"À ")+escPm(other.username||"Membre")+'</strong><small>'+escPm(date)+'</small></div><p>'+escPm(m.content)+'</p><div class="pm-actions">'+(view==="received"?'<a href="messages.html?to='+encodeURIComponent(m.sender_id)+'">Répondre</a>':'')+'<button type="button" class="pm-delete" data-id="'+m.id+'">Supprimer</button></div></div></article>';
   }).join("");
   box.querySelectorAll(".pm-delete").forEach(btn=>btn.addEventListener("click",async()=>{if(!confirm("Supprimer ce message de votre boîte ?"))return;btn.disabled=true;const field=view==="received"?"recipient_deleted":"sender_deleted";const {error}=await sb.from("private_messages").update({[field]:true}).eq("id",btn.dataset.id);if(error){alert("Suppression impossible : "+error.message);btn.disabled=false;return}await load()}));
 }
 document.getElementById("tab-received").onclick=()=>{view="received";render()};
 document.getElementById("tab-sent").onclick=()=>{view="sent";render()};
 const to=new URLSearchParams(location.search).get("to");
 if(to&&to!==user.id){
   const {data:recipient}=await sb.from("profiles").select("id,username").eq("id",to).maybeSingle();
   if(recipient){
     document.getElementById("compose").hidden=false;document.getElementById("compose-title").textContent="Nouveau message à "+recipient.username;
     document.getElementById("send-pm").onclick=async()=>{
       const content=document.getElementById("pm-content").value.trim(),status=document.getElementById("pm-status"),btn=document.getElementById("send-pm");
       if(!content){status.textContent="Écris un message avant de l’envoyer.";return}
       
       btn.disabled=true;status.textContent="Envoi…";
       const {error}=await sb.from("private_messages").insert({sender_id:user.id,recipient_id:recipient.id,content});
       if(error){status.textContent="Impossible d’envoyer : "+error.message;btn.disabled=false;return}
       status.textContent="Message envoyé !";setTimeout(()=>location.href="messages.html",500);
     };
   }
 }
 await load();
})();
</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages privés — Heroscape France</title><link rel="stylesheet" href="css/style.css?v=20261002-2"></head><body><header><div class="container"><h1>Heroscape France</h1><nav><a href="index.html">← Forum</a><a href="profil.html">Mon profil</a></nav></div></header><main class="container"><section class="hero"><h2>✉ Messages privés</h2><p>Ta messagerie privée Heroscape France.</p></section><div id="private-messages" class="card"><p>Chargement…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script>(async()=>{const b=document.getElementById("private-messages");const {data:{user}}=await window.supabaseClient.auth.getUser();if(!user){location.href="connexion.html";return}const {data,error}=await window.supabaseClient.from("private_messages").select("id,sender_id,recipient_id,content,created_at,is_read").or("sender_id.eq."+user.id+",recipient_id.eq."+user.id).order("created_at",{ascending:false});if(error){b.innerHTML="<p>La messagerie sera disponible dès que sa table Supabase sera activée.</p>";return}b.innerHTML=data.length?data.map(m=>"<div class='pm-row'><strong>"+(m.sender_id===user.id?"Envoyé":"Reçu")+"</strong><p>"+String(m.content).replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))+"</p></div>").join(""):"<p>Aucun message privé pour le moment.</p>";})();</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/forum.js"></script></body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Heroscape France</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
</head>

<body>

  <header>
    <div class="container">
      <h1>Heroscape France</h1>
      <p>Communauté francophone Heroscape</p>
    </div>
  </header>

  <main class="container">

    <p>
      <a href="index.html">← Retour à l'accueil</a>
    </p>

    <section class="card" id="profile-card" hidden>
      <h2>Mon profil</h2>
      <p>Choisis l'image qui apparaîtra à côté de tes messages.</p>
      <div class="avatar-settings">
        <div id="avatar-preview" class="post-avatar post-avatar-default">?</div>
        <div>
          <label for="avatar-file">Choisir une image</label><br>
          <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp,image/gif">
          <p class="count">JPG, PNG, WebP ou GIF — 2 Mo maximum.</p>
          <details>
            <summary>Ou utiliser l'adresse d'une image</summary>
            <p><input type="url" id="avatar-url" placeholder="https://exemple.fr/mon-avatar.jpg" style="width:100%;max-width:520px"></p>
          </details>
          <p><button class="btn" id="save-avatar" type="button">Enregistrer mon avatar</button></p>
          <p id="avatar-message"></p>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Connexion</h2>

      <form id="login-form">
        <p>
          <label for="login-email">Adresse e-mail</label><br>
          <input
            type="email"
            id="login-email"
            required
            autocomplete="email"
          >
        </p>

        <p>
          <label for="login-password">Mot de passe</label><br>
          <input
            type="password"
            id="login-password"
            required
            autocomplete="current-password"
          >
        </p>

        <button type="submit">Se connecter</button>
      </form>

      <p id="login-message"></p>
    </section>

    <section class="card">
      <h2>Créer un compte</h2>

      <form id="signup-form">
        <p>
          <label for="signup-username">Pseudo</label><br>
          <input
            type="text"
            id="signup-username"
            minlength="3"
            maxlength="30"
            required
            autocomplete="username"
          >
        </p>

        <p>
          <label for="signup-email">Adresse e-mail</label><br>
          <input
            type="email"
            id="signup-email"
            required
            autocomplete="email"
          >
        </p>

        <p>
          <label for="signup-password">Mot de passe</label><br>
          <input
            type="password"
            id="signup-password"
            minlength="6"
            required
            autocomplete="new-password"
          >
        </p>

        <button type="submit">Créer mon compte</button>
      </form>

      <p id="signup-message"></p>
    </section>

  </main>

  <script>

    async function loadProfileEditor() {
      const { data: { user } } = await window.supabaseClient.auth.getUser();
      if (!user) return;

      const { data: profile } = await window.supabaseClient
        .from("profiles")
        .select("username, avatar_url")
        .eq("id", user.id)
        .single();

      if (!profile) return;

      const card = document.getElementById("profile-card");
      const urlInput = document.getElementById("avatar-url");
      const fileInput = document.getElementById("avatar-file");
      const message = document.getElementById("avatar-message");
      const saveButton = document.getElementById("save-avatar");

      card.hidden = false;
      urlInput.value = profile.avatar_url || "";

      function setPreview(url) {
        const old = document.getElementById("avatar-preview");
        if (!old) return;
        if (url) {
          const img = document.createElement("img");
          img.id = "avatar-preview";
          img.className = "post-avatar";
          img.src = url;
          img.alt = "Aperçu de l'avatar";
          old.replaceWith(img);
        }
      }

      setPreview(profile.avatar_url);

      fileInput.addEventListener("change", () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          message.textContent = "L'image dépasse 2 Mo.";
          message.style.color = "crimson";
          fileInput.value = "";
          return;
        }
        setPreview(URL.createObjectURL(file));
        message.textContent = "";
      });

      saveButton.addEventListener("click", async () => {
        saveButton.disabled = true;
        message.textContent = "Enregistrement en cours…";
        message.style.color = "";

        try {
          let avatarUrl = urlInput.value.trim() || null;
          const file = fileInput.files?.[0];

          if (file) {
            const extension = (file.name.split(".").pop() || "jpg").toLowerCase();
            const path = user.id + "/avatar-" + Date.now() + "." + extension;

            const { error: uploadError } = await window.supabaseClient.storage
              .from("avatars")
              .upload(path, file, {
                cacheControl: "3600",
                upsert: true,
                contentType: file.type
              });

            if (uploadError) throw uploadError;

            const { data: publicData } = window.supabaseClient.storage
              .from("avatars")
              .getPublicUrl(path);

            avatarUrl = publicData.publicUrl;
          }

          const { error } = await window.supabaseClient
            .from("profiles")
            .update({ avatar_url: avatarUrl })
            .eq("id", user.id);

          if (error) throw error;

          urlInput.value = avatarUrl || "";
          setPreview(avatarUrl);
          fileInput.value = "";
          message.textContent = "Avatar enregistré !";
          message.style.color = "green";
        } catch (error) {
          console.error("Erreur avatar :", error);
          message.textContent =
            "Impossible d'enregistrer l'avatar. Si tu as choisi un fichier, le stockage « avatars » doit être activé dans Supabase.";
          message.style.color = "crimson";
        } finally {
          saveButton.disabled = false;
        }
      });
    }

    loadProfileEditor();

    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");

    const loginMessage = document.getElementById("login-message");
    const signupMessage = document.getElementById("signup-message");

    function showMessage(element, message, success = false) {
      element.textContent = message;
      element.style.fontWeight = "bold";
      element.style.color = success ? "green" : "crimson";
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      loginMessage.textContent = "Connexion en cours...";

      const email = document
        .getElementById("login-email")
        .value
        .trim();

      const password = document
        .getElementById("login-password")
        .value;

      const { data, error } =
        await window.supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        console.error("Erreur connexion :", error);

        showMessage(
          loginMessage,
          "Connexion impossible : " + error.message
        );

        return;
      }

      showMessage(
        loginMessage,
        "Connexion réussie. Retour au forum...",
        true
      );

      setTimeout(() => {
        window.location.href = "index.html";
      }, 800);
    });


    signupForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      signupMessage.textContent = "Création du compte...";

      const username = document
        .getElementById("signup-username")
        .value
        .trim();

      const email = document
        .getElementById("signup-email")
        .value
        .trim();

      const password = document
        .getElementById("signup-password")
        .value;

      if (username.length < 3) {
        showMessage(
          signupMessage,
          "Le pseudo doit contenir au moins 3 caractères."
        );
        return;
      }

      const { data, error } =
        await window.supabaseClient.auth.signUp({
          email,
          password,

          options: {
            emailRedirectTo:
              "https://tandroskreel.github.io/heroscape-france/connexion.html",

            data: {
              username: username
            }
          }
        });

      if (error) {
        console.error("Erreur inscription :", error);

        showMessage(
          signupMessage,
          "Inscription impossible : " + error.message
        );

        return;
      }

      signupForm.reset();

      if (data.session) {
        showMessage(
          signupMessage,
          "Compte créé avec succès.",
          true
        );
      } else {
        showMessage(
          signupMessage,
          "Compte créé ! Consulte ta boîte e-mail et clique sur le lien de confirmation avant de te connecter.",
          true
        );
      }
    });
  </script>

</body>
</html>

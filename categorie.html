<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catégorie — Heroscape France</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="container"><div class="brand"><div class="logo">HS</div><div><h1>Heroscape France</h1><div class="tag">Forum & archives francophones</div></div></div>
<nav><a class="active" href="index.html">Forum</a><a href="cartes-armee.html">Cartes d'armée</a><a href="regles.html">Règles</a></nav></div></header>
<main class="container"><section class="hero"><a href="index.html">← Retour au forum</a><h2 id="title"></h2><p id="desc"></p></section>
<div class="toolbar"><input id="search" placeholder="Rechercher un sujet…"><button class="btn" onclick="newTopic()">Nouveau sujet</button></div>
<div id="topics"></div></main><footer><div class="container">Heroscape France</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/forum.js"></script>
<script>
const params = new URLSearchParams(location.search);
const cat = params.get("cat") || "general";

const meta = cats.find(c => c[0] === cat) || cats[0];
document.getElementById("title").textContent = meta[1] + " " + meta[2];
document.getElementById("desc").textContent = meta[3];

async function render() {
  const q = document.getElementById("search").value.toLowerCase();

  const topics = await getTopics();

  const arr = topics.filter(t =>
    t.cat === cat &&
    ((t.title || "") + (t.body || "") + (t.author || ""))
      .toLowerCase()
      .includes(q)
  );

  document.getElementById("topics").innerHTML = arr.length
    ? arr.map(t => `
        <a class="topic" href="sujet.html?id=${t.id}">
          <div>
            <strong>${esc(t.title)}</strong>
            <div class="count">
              Par ${esc(t.author || "Visiteur")}
            </div>
          </div>
        </a>
      `).join("")
    : '<div class="empty">Aucun sujet dans cette catégorie.</div>';
}

document.getElementById("search").addEventListener("input", render);

async function newTopic() {
  const title = prompt("Titre du sujet :");
  if (!title) return;

  const author = prompt("Votre pseudo :", "Visiteur") || "Visiteur";
  const body = prompt("Votre message :");
  if (!body) return;

  const { data, error } = await window.supabaseClient
    .from("topics")
    .insert({
      cat: cat,
      title: title,
      author: author,
      body: body
    })
    .select()
    .single();

  if (error) {
    console.error(error);
    alert("Impossible de créer le sujet.");
    return;
  }

  location.href = "sujet.html?id=" + data.id;
}

render();
</script>
</body>
</html>

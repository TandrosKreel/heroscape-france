<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Catégorie — Heroscape France</title>

  <link rel="stylesheet" href="css/style.css?v=20261006-33">
</head>

<body>

<header>
  <div class="container">

    <div class="brand home-brand">
      <img class="heroscape-main-logo" src="Logo%20Heroscape%20_%20bataille%20%C3%A9ternelle.png" alt="Heroscape">
      <div class="tag">Forum & archives francophones</div>
    </div>

    <nav>
      <a class="active" href="index.html">Forum</a>
      <a href="cartes-armee.html">Cartes Armées</a>
      <a href="regles.html">Règles</a>
      <a href="liens-utiles.html">Liens utiles</a>
      <a href="membres.html">Membres</a>
    </nav>

  </div>
</header>


<main class="container">

  <section class="hero">

    <a href="index.html">← Retour au forum</a>

    <h2 id="title"></h2>

    <p id="desc"></p>

    <div id="member-area"></div>

  </section>


  <div class="toolbar">

    <input
      id="search"
      type="search"
      placeholder="Rechercher un sujet…"
    >

    <button
      class="btn"
      id="new-topic-button"
      type="button"
    >
      Nouveau sujet
    </button>

  </div>


  <div id="new-topic-form" class="card" hidden>

    <h3>Nouveau sujet</h3>

    <p>
      <label for="topic-title">Titre</label><br>

      <input
        id="topic-title"
        type="text"
        minlength="3"
        maxlength="200"
        style="width:100%;box-sizing:border-box"
      >
    </p>

    <p>
      <label for="topic-body">Message</label><br>

      <textarea
        id="topic-body"
        rows="8"
        maxlength="20000"
        style="width:100%;box-sizing:border-box"
      ></textarea>
    </p>

    <p>
      <button
        class="btn"
        id="publish-topic-button"
        type="button"
      >
        Publier le sujet
      </button>

      <button
        id="cancel-topic-button"
        type="button"
      >
        Annuler
      </button>
    </p>

    <p id="topic-message"></p>

  </div>


  <div id="topics"></div>

</main>


<footer>
  <div class="container">
    Heroscape France
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>

<script src="js/forum.js?v=20261006-29"></script>


<script>

const params = new URLSearchParams(location.search);

const cat = params.get("cat") || "";

async function renderCategoryHeader() {
  const meta = await getCategoryBySlug(cat);
  if (!meta) {
    document.getElementById("title").textContent = "Catégorie introuvable";
    document.getElementById("desc").textContent = "";
    return false;
  }
  document.getElementById("title").textContent = meta[1] + " " + meta[2];
  document.getElementById("desc").textContent = meta[3];
  document.title = meta[2] + " — Heroscape France";
  return true;
}


const topicsBox =
  document.getElementById("topics");

const searchInput =
  document.getElementById("search");

const memberArea =
  document.getElementById("member-area");

const newTopicButton =
  document.getElementById("new-topic-button");

const newTopicForm =
  document.getElementById("new-topic-form");

const topicTitle =
  document.getElementById("topic-title");

const topicBody =
  document.getElementById("topic-body");

const topicMessage =
  document.getElementById("topic-message");

const publishTopicButton =
  document.getElementById("publish-topic-button");

const cancelTopicButton =
  document.getElementById("cancel-topic-button");


// ------------------------------------------------------------
// AFFICHAGE DU MEMBRE CONNECTÉ
// ------------------------------------------------------------

async function renderMember() {

  const profile = await getCurrentProfile();

  if (!profile) {

    memberArea.innerHTML = `
      <p>
        <a href="connexion.html">
          Se connecter ou créer un compte
        </a>
      </p>
    `;

    return;
  }

  memberArea.innerHTML = `
    <p>
      Connecté :
      <strong>${esc(profile.username)}</strong>
      —
      <button
        type="button"
        id="logout-button"
      >
        Se déconnecter
      </button>
    </p>
  `;

  document
    .getElementById("logout-button")
    .addEventListener("click", logout);
}


// ------------------------------------------------------------
// AFFICHAGE DES SUJETS
// ------------------------------------------------------------

function formatTopicDate(value) {
  if (!value) return "";

  return new Intl.DateTimeFormat("fr-FR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(new Date(value));
}

async function render() {

  topicsBox.innerHTML =
    '<div class="empty">Chargement des sujets…</div>';

  const q =
    searchInput.value
      .trim()
      .toLowerCase();

  const topics =
    await getTopics(cat);

  const arr =
    topics.filter(topic => {

      const searchable =
        (
          (topic.title || "") +
          " " +
          (topic.author || "")
        ).toLowerCase();

      return searchable.includes(q);
    });


  if (!arr.length) {

    topicsBox.innerHTML =
      '<div class="empty">Aucun sujet dans cette catégorie.</div>';

    return;
  }


  const currentUser = await getCurrentUser();
  const lastAuthors = await getThreadLastAuthors(arr.map(topic => topic.id));
  const { data: latestPosts } = await window.supabaseClient
    .from("posts")
    .select("thread_id,user_id,created_at,profiles(username)")
    .in("thread_id", arr.map(topic => topic.id))
    .order("created_at", { ascending: false });
  const lastPosts = {};
  for (const post of (latestPosts || [])) {
    if (!lastPosts[post.thread_id]) lastPosts[post.thread_id] = post;
  }

  topicsBox.innerHTML =
    arr.map(topic => `

      <a
        class="topic"
        href="sujet.html?id=${encodeURIComponent(topic.id)}"
      >

        <div class="topic-main">

          <div class="topic-title">
            ${topic.is_pinned ? '<span class="topic-pin">📌 Épinglé</span>' : ""}
            <strong>${esc(topic.title)}</strong>
          </div>

          <div class="topic-meta">
            <span>👤 ${esc(topic.author || "Membre")}</span>
            <span>🕒 ${formatTopicDate(topic.updated_at || topic.created_at)}</span>
          </div>

        </div>

        <div class="topic-status">${readDiceHtml(
          isThreadUnread(topic.id, topic.updated_at || topic.created_at),
          "",
          !isThreadUnread(topic.id, topic.updated_at || topic.created_at) && (lastAuthors[topic.id] || topic.user_id) === currentUser?.id
        )}<span class="topic-last-post">Posté par <strong>${esc(lastPosts[topic.id]?.profiles?.username || topic.author || "Membre")}</strong> à ${formatTopicDate(lastPosts[topic.id]?.created_at || topic.updated_at || topic.created_at)}</span><span class="topic-arrow" aria-hidden="true">›</span></div>

      </a>

    `).join("");
}


// ------------------------------------------------------------
// BOUTON NOUVEAU SUJET
// ------------------------------------------------------------

newTopicButton.addEventListener(
  "click",
  async () => {

    const user =
      await getCurrentUser();

    if (!user) {

      alert(
        "Tu dois être connecté pour créer un sujet."
      );

      location.href =
        "connexion.html";

      return;
    }

    topicMessage.textContent = "";

    newTopicForm.hidden = false;

    topicTitle.focus();
  }
);


// ------------------------------------------------------------
// ANNULER
// ------------------------------------------------------------

cancelTopicButton.addEventListener(
  "click",
  () => {

    newTopicForm.hidden = true;

    topicTitle.value = "";
    topicBody.value = "";
    topicMessage.textContent = "";
  }
);


// ------------------------------------------------------------
// PUBLIER LE SUJET
// ------------------------------------------------------------

publishTopicButton.addEventListener(
  "click",
  async () => {

    const title =
      topicTitle.value.trim();

    const body =
      topicBody.value.trim();


    if (title.length < 3) {

      topicMessage.textContent =
        "Le titre doit contenir au moins 3 caractères.";

      return;
    }


    if (!body) {

      topicMessage.textContent =
        "Écris un message avant de publier.";

      return;
    }


    publishTopicButton.disabled = true;

    topicMessage.textContent =
      "Publication en cours…";


    const topic =
      await addTopic(
        cat,
        title,
        null,
        body
      );


    if (!topic) {

      topicMessage.textContent =
        "Impossible de créer le sujet.";

      publishTopicButton.disabled = false;

      return;
    }


    location.href =
      "sujet.html?id=" +
      encodeURIComponent(topic.id);
  }
);


// ------------------------------------------------------------
// RECHERCHE
// ------------------------------------------------------------

searchInput.addEventListener(
  "input",
  render
);


// ------------------------------------------------------------
// DÉMARRAGE
// ------------------------------------------------------------

renderMember();

(async () => {
  const validCategory = await renderCategoryHeader();
  if (validCategory) {
    render();
  } else {
    topicsBox.innerHTML = '<div class="empty">Cette catégorie n’existe pas.</div>';
    newTopicButton.hidden = true;
  }
})();

</script>

</body>
</html>

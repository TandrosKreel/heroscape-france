<body>

<header>

      <a href="cartes-armee.html">Cartes Armées</a>

<main class="container">

  <section class="hero">

    <a href="index.html?v=20261013-nav10">← Retour au forum</a>

    <h2 id="title"></h2>

    <p id="desc"></p>

    <div id="member-area"></div>

  </section>


  <div class="toolbar">

    <input
      id="search"
      type="search"
      placeholder="Rechercher un sujet…"
    >

    <button
      class="btn"
      id="new-topic-button"
      type="button"
    >
      Nouveau sujet
    </button>

  </div>


  <div id="new-topic-form" class="card" hidden>

    <h3>Nouveau sujet</h3>

    <p>
      <label for="topic-title">Titre</label><br>

      <input
        id="topic-title"
        type="text"
        minlength="3"
        maxlength="200"
        style="width:100%;box-sizing:border-box"
      >
    </p>

    <p>
      <label for="topic-body">Message</label><br>

      <div class="forum-format-toolbar" id="topic-format-toolbar" role="toolbar" aria-label="Mise en forme du premier message">
<button type="button" data-format="b" title="Gras"><strong>G</strong></button><button type="button" data-format="i" title="Italique"><em>I</em></button><button type="button" data-format="s" title="Barré"><s>S</s></button>
<select data-size aria-label="Taille"><option value="3">Normal</option><option value="1">Très petit</option><option value="2">Petit</option><option value="4">Grand</option><option value="5">Très grand</option></select>
<select data-font aria-label="Police"><option value="1">Arial</option><option value="2">Georgia</option><option value="3">Monospace</option><option value="4">Cursive</option><option value="5">Fantaisie</option></select>
<select data-color aria-label="Couleur"><option value="">Couleur</option><option value="#ffffff">Blanc</option><option value="#cbd5e1">Gris clair</option><option value="#111827">Noir</option><option value="#facc15">Jaune</option><option value="#f97316">Orange</option><option value="#ef4444">Rouge</option><option value="#ec4899">Rose</option><option value="#a855f7">Violet</option><option value="#6366f1">Indigo</option><option value="#3b82f6">Bleu</option><option value="#22c55e">Vert</option><option value="#14b8a6">Turquoise</option></select>
<button type="button" data-align="left" title="Aligner à gauche">⇤</button><button type="button" data-align="center" title="Centrer">↔</button><button type="button" data-align="right" title="Aligner à droite">⇥</button>
<button type="button" id="topic-insert-link">🔗 Lien</button><button type="button" id="topic-insert-quote">❝ Citation</button><button type="button" id="topic-insert-image">📷 Photo</button><input type="file" id="topic-image-file" accept="image/jpeg,image/png,image/webp" hidden>
</div>
<div id="topic-body" class="reply-rich-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Écris le premier message de ton sujet…"></div>
<div class="smileys-toolbar">
  <button class="btn" id="topic-smileys" type="button" aria-expanded="false" aria-controls="topic-smileys-picker">😊 Smileys</button>
  <div class="smileys-picker" id="topic-smileys-picker" hidden>
    <div class="smileys-picker-head"><strong>Choisir un smiley</strong><button type="button" id="topic-smileys-close" aria-label="Fermer les smileys">×</button></div>
    <div class="smileys-grid" id="topic-smileys-list"></div>
  </div>
</div>
    </p>

    <p>
      <button
        class="btn"
        id="publish-topic-button"
        type="button"
      >
        Publier le sujet
      </button>

      <button
        id="cancel-topic-button"
        type="button"
      >
        Annuler
      </button>

  </div>


  <div id="topics"></div>

</main>


<footer>
  <div class="container">
    Heroscape France
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>
<script src="js/forum-background.js?v=20261013-refresh9"></script><script src="js/forum-topbar.js?v=20261015-readaction2"></script>

<script src="js/forum.js?v=20261013-fastaccount12"></script>
<script src="js/smileys-data.js?v=20261009-6"></script>
<script src="js/topic-composer.js?v=20261013-1"></script>


<script>

const params = new URLSearchParams(location.search);

const cat = params.get("cat") || "";

async function renderCategoryHeader() {
  const meta = await getCategoryBySlug(cat);
  if (!meta) {
    document.getElementById("title").textContent = "Catégorie introuvable";
    document.getElementById("desc").textContent = "";
    return false;
  }
  document.getElementById("title").textContent = meta[1] + " " + meta[2];
  document.getElementById("desc").textContent = meta[3];
  document.title = meta[2] + " — Heroscape France";
  return true;
}


const topicsBox =
  document.getElementById("topics");

const searchInput =
  document.getElementById("search");

const memberArea =
  document.getElementById("member-area");

const newTopicButton =
  document.getElementById("new-topic-button");

const newTopicForm =
  document.getElementById("new-topic-form");

const topicTitle =
  document.getElementById("topic-title");

const topicBody =
  document.getElementById("topic-body");

const topicMessage =
  document.getElementById("topic-message");

const topicToolbar=document.getElementById("topic-format-toolbar");
setupForumFormatting(topicBody,topicToolbar);
document.getElementById("topic-insert-link").addEventListener("click",()=>{
  const selected=window.getSelection()?.toString()||"";
  openForumLinkDialog((url,label)=>{
    topicBody.focus();
    document.execCommand("insertHTML",false,'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer nofollow">'+esc(label)+'</a>');
  },selected);
});
document.getElementById("topic-insert-quote").addEventListener("click",()=>{
  const name=prompt("Qui souhaitez-vous citer ? (facultatif)","");
  if(name===null)return;
  const quote=document.createElement("blockquote");quote.className="forum-quote forum-quote-draft";
  quote.dataset.quoteAuthor=name.trim().replace(/[\\[\\]\\r\\n]/g,"").slice(0,80);
  const heading=document.createElement("strong");heading.textContent=quote.dataset.quoteAuthor?quote.dataset.quoteAuthor+" a écrit :":"Citation :";
  const body=document.createElement("div");body.dataset.placeholder="Écrivez ici le texte à citer…";
  quote.append(heading,body);enhanceForumQuote(quote);
  topicBody.append(quote,document.createElement("div"));body.focus();
});
const smileysList=document.getElementById("topic-smileys-list");
const smileysToggle=document.getElementById("topic-smileys");
const smileysPicker=document.getElementById("topic-smileys-picker");
const smileysClose=document.getElementById("topic-smileys-close");
let topicSmileySelection=null;
topicBody.addEventListener("keyup",()=>{
 const selection=window.getSelection();
 if(selection.rangeCount&&topicBody.contains(selection.getRangeAt(0).commonAncestorContainer))topicSmileySelection=selection.getRangeAt(0).cloneRange();
});
topicBody.addEventListener("mouseup",()=>{
 const selection=window.getSelection();
 if(selection.rangeCount&&topicBody.contains(selection.getRangeAt(0).commonAncestorContainer))topicSmileySelection=selection.getRangeAt(0).cloneRange();
});
smileysToggle.addEventListener("pointerdown",()=>{
 const selection=window.getSelection();
 if(selection.rangeCount&&topicBody.contains(selection.getRangeAt(0).commonAncestorContainer))topicSmileySelection=selection.getRangeAt(0).cloneRange();
});
smileysToggle.addEventListener("click",()=>{
 if(!smileysList.childElementCount){
   const names=Object.keys(SMILEYS);
   smileysList.innerHTML=names.length
     ? names.map(key=>'<button class="smiley-choice" type="button" data-smiley="'+key+'" title="'+key.replace(/_/g," ")+'"><img src="'+SMILEYS[key]+'" alt="'+key+'" loading="lazy" decoding="async"></button>').join("")
     : '<p>Les fichiers des smileys ne sont pas encore disponibles.</p>';
 }
 smileysPicker.hidden=!smileysPicker.hidden;
 smileysToggle.setAttribute("aria-expanded",String(!smileysPicker.hidden));
});
smileysClose.addEventListener("click",()=>{
 smileysPicker.hidden=true;smileysToggle.setAttribute("aria-expanded","false");smileysToggle.focus();
});
smileysList.addEventListener("click",event=>{
 const button=event.target.closest("[data-smiley]");if(!button)return;
 topicBody.focus();
 const selection=window.getSelection();
 let range=topicSmileySelection&&topicBody.contains(topicSmileySelection.commonAncestorContainer)?topicSmileySelection.cloneRange():null;
 if(!range){range=document.createRange();range.selectNodeContents(topicBody);range.collapse(false);}
 range.deleteContents();
 const img=document.createElement("img");
 img.className="reply-editor-smiley";img.src=SMILEYS[button.dataset.smiley];img.alt="Smiley "+button.dataset.smiley;
 img.dataset.smiley=button.dataset.smiley;img.contentEditable="false";
 range.insertNode(img);range.setStartAfter(img);range.collapse(true);
 selection.removeAllRanges();selection.addRange(range);topicSmileySelection=range.cloneRange();
});
document.addEventListener("keydown",event=>{
 if(event.key==="Escape"&&!smileysPicker.hidden){
   smileysPicker.hidden=true;smileysToggle.setAttribute("aria-expanded","false");smileysToggle.focus();
 }
});
document.getElementById("topic-insert-image").addEventListener("click",()=>document.getElementById("topic-image-file").click());
document.getElementById("topic-image-file").addEventListener("change",async event=>{
 const file=event.target.files?.[0];event.target.value="";if(!file)return;
 if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>8*1024*1024){topicMessage.textContent="Image JPG, PNG ou WebP de moins de 8 Mo requise.";return;}
 const button=document.getElementById("topic-insert-image");button.disabled=true;topicMessage.textContent="Envoi de la photo…";
 try{
  const bitmap=await createImageBitmap(file);const scale=Math.min(1,1400/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/webp",0.78));
  if(!blob||blob.size>2*1024*1024)throw Error("Image trop volumineuse.");
  const current=await getCurrentUser();if(!current)throw Error("Connexion requise.");
  const path=current.id+"/"+crypto.randomUUID()+".webp";
  const {error}=await window.supabaseClient.storage.from("forum-images").upload(path,blob,{contentType:"image/webp",upsert:false});
  if(error)throw error;
  const img=document.createElement("img");img.dataset.forumImage=path;img.className="forum-post-image";img.alt="Photo jointe";img.src=window.supabaseClient.storage.from("forum-images").getPublicUrl(path).data.publicUrl;img.contentEditable="false";
  topicBody.append(img);topicMessage.textContent="Photo insérée.";
 }catch(error){console.error(error);topicMessage.textContent="Envoi de la photo impossible.";}finally{button.disabled=false;}
});


const publishTopicButton =
  document.getElementById("publish-topic-button");

const cancelTopicButton =
  document.getElementById("cancel-topic-button");


// ------------------------------------------------------------
// AFFICHAGE DU MEMBRE CONNECTÉ
// ------------------------------------------------------------

async function renderMember() {

  const profile = await getCurrentProfile();

  if (!profile) {

    memberArea.innerHTML = `
      <p>
        <a href="connexion.html">
          Se connecter ou créer un compte
        </a>
      </p>
    `;

    return;
  }

  memberArea.innerHTML = `
    <p>
      Connecté :
      <strong>${esc(profile.username)}</strong>
      —
      <button
        type="button"
        id="logout-button"
      >
        Se déconnecter
      </button>
    </p>
  `;

  document
    .getElementById("logout-button")
    .addEventListener("click", logout);
}


// ------------------------------------------------------------
// AFFICHAGE DES SUJETS
// ------------------------------------------------------------

function formatTopicDate(value) {
  if (!value) return "";

  return new Intl.DateTimeFormat("fr-FR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(new Date(value));
}

async function render() {

  topicsBox.innerHTML =
    '<div class="empty">Chargement des sujets…</div>';

  const q =
    searchInput.value
      .trim()
      .toLowerCase();

  const topics =
    await getTopics(cat);

  const arr =
    topics.filter(topic => {

      const searchable =
        (
          (topic.title || "") +
          " " +
          (topic.author || "")
        ).toLowerCase();

      return searchable.includes(q);
    });


  if (!arr.length) {

    topicsBox.innerHTML =
      '<div class="empty">Aucun sujet dans cette catégorie.</div>';

    return;
  }


  const currentUser = await getCurrentUser();
  await loadThreadReadStates(arr.map(topic => topic.id));
  const lastAuthors = await getThreadLastAuthors(arr.map(topic => topic.id));
  const { data: latestPosts } = await window.supabaseClient
    .from("posts")
    .select("thread_id,user_id,created_at,profiles(username)")
    .in("thread_id", arr.map(topic => topic.id))
    .order("created_at", { ascending: false });
  const lastPosts = {};
  const postCounts = {};
  for (const post of (latestPosts || [])) {
    postCounts[post.thread_id] = (postCounts[post.thread_id] || 0) + 1;
    if (!lastPosts[post.thread_id]) lastPosts[post.thread_id] = post;
  }

  function topicPageLinks(topicId) {
    const totalPages = Math.max(1, Math.ceil((postCounts[topicId] || 1) / 25));
    if (totalPages <= 1) return "";

    const pages = totalPages <= 5
      ? Array.from({ length: totalPages }, (_, i) => i + 1)
      : [1, 2, 3, totalPages - 1, totalPages];

    return '<span class="topic-page-links" aria-label="Pages du sujet"><span class="topic-pages-label">Pages</span>' +
      pages.map(pageNumber =>
        '<a href="sujet.html?id=' + encodeURIComponent(topicId) + '&page=' + pageNumber +
        '" title="Aller à la page ' + pageNumber + '">' + pageNumber + '</a>'
      ).join("") +
      '</span>';
  }

  topicsBox.innerHTML =
    arr.map(topic => {
      const totalPages = Math.max(1, Math.ceil((postCounts[topic.id] || 1) / 25));
      const lastUrl = "sujet.html?v=20261013-topic11&id=" + encodeURIComponent(topic.id) + "&page=" + totalPages +
        (lastPosts[topic.id]?.id ? "#post-" + encodeURIComponent(lastPosts[topic.id].id) : "");

      return `

      <div class="topic">

        <div class="topic-main">

          <div class="topic-title">
            ${topic.is_pinned ? '<span class="topic-pin">📌 Épinglé</span>' : ""}
            <a class="topic-title-link" href="sujet.html?id=${encodeURIComponent(topic.id)}"><strong>${esc(topic.title)}</strong></a>
          </div>

          <div class="topic-meta">
            <span>👤 ${esc(topic.author || "Membre")}</span>
            <span>🕒 ${formatTopicDate(topic.updated_at || topic.created_at)}</span>
          </div>

        </div>

        <div class="topic-side">${topicPageLinks(topic.id)}<a class="topic-status" href="${lastUrl}" title="Aller au dernier message">${readDiceHtml(
          isThreadUnread(topic.id, lastPosts[topic.id]?.created_at || topic.updated_at || topic.created_at),
          "",
          !isThreadUnread(topic.id, lastPosts[topic.id]?.created_at || topic.updated_at || topic.created_at) && (lastAuthors[topic.id] || topic.user_id) === currentUser?.id
        )}<span class="topic-last-post">Posté par <strong>${esc((lastPosts[topic.id] && lastPosts[topic.id].user_id === null ? "Membre supprimé" : (lastPosts[topic.id]?.profiles?.username || topic.author || "Membre")))}</strong> à ${formatTopicDate(lastPosts[topic.id]?.created_at || topic.updated_at || topic.created_at)}</span><span class="topic-arrow" aria-hidden="true">›</span></a></div>

      </div>

    `;
    }).join("");
}


// ------------------------------------------------------------
// BOUTON NOUVEAU SUJET
// ------------------------------------------------------------

newTopicButton.addEventListener(
  "click",
  async () => {

    const user =
      await getCurrentUser();

    if (!user) {

      alert(
        "Tu dois être connecté pour créer un sujet."
      );

      location.href =
        "connexion.html";

      return;
    }

    topicMessage.textContent = "";

    newTopicForm.hidden = false;

    topicTitle.focus();
  }
);


// ------------------------------------------------------------
// ANNULER
// ------------------------------------------------------------

cancelTopicButton.addEventListener(
  "click",
  () => {

    newTopicForm.hidden = true;

    topicTitle.value = "";
    topicBody.replaceChildren();
    topicMessage.textContent = "";
  }
);


// ------------------------------------------------------------
// PUBLIER LE SUJET
// ------------------------------------------------------------

publishTopicButton.addEventListener(
  "click",
  async () => {

    const title =
      topicTitle.value.trim();

    const body =
      serializeForumEditor(topicBody).trim();


    if (title.length < 3) {

      topicMessage.textContent =
        "Le titre doit contenir au moins 3 caractères.";

      return;
    }


    if (!body) {

      topicMessage.textContent =
        "Écris un message avant de publier.";

      return;
    }


    publishTopicButton.disabled = true;

    topicMessage.textContent =
      "Publication en cours…";


    const topic =
      await addTopic(
        cat,
        title,
        null,
        body
      );


    if (!topic) {

      topicMessage.textContent =
        "Impossible de créer le sujet.";

      publishTopicButton.disabled = false;

      return;
    }


    location.href =
      "sujet.html?v=20261013-topic11&id=" +
      encodeURIComponent(topic.id);
  }
);


// ------------------------------------------------------------
// RECHERCHE
// ------------------------------------------------------------

searchInput.addEventListener(
  "input",
  render
);


// ------------------------------------------------------------
// DÉMARRAGE
// ------------------------------------------------------------

renderMember();

(async () => {
  const validCategory = await renderCategoryHeader();
  if (validCategory) {
    render();
  } else {
    topicsBox.innerHTML = '<div class="empty">Cette catégorie n’existe pas.</div>';
    newTopicButton.hidden = true;
  }
})();

</script>

</body>
</html>

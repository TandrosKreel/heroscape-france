<script>

// ============================================================
// PARAMÈTRES
// ============================================================

const params =
  new URLSearchParams(location.search);

const id =
  Number(params.get("id"));

const page = Math.max(1, Number(params.get("page")) || 1);
const POSTS_PER_PAGE = 25;

const subjectBox =

const memberArea =
  document.getElementById("member-area");

const backLink =
  document.getElementById("back-link");


// Smileys historiques : codes sûrs, convertis en images après échappement HTML.
const SMILEYS = window.HEROSCAPE_SMILEYS || {};
function renderSmileys(text) {
  return esc(text).replace(/\[smiley:([a-z0-9_]+)\]/g, (match, key) =>
    Object.prototype.hasOwnProperty.call(SMILEYS, key)
      ? '<img class="forum-inline-smiley" src="' + SMILEYS[key] + '" alt="Smiley ' + key + '">'
      : match
  );
}
function renderInlineMarkup(text) {
  const colors = ["#ffffff","#cbd5e1","#111827","#facc15","#f97316","#ef4444","#ec4899","#a855f7","#6366f1","#3b82f6","#22c55e","#14b8a6"];
  const fonts = ["Arial","Georgia","Trebuchet MS","Palatino Linotype","Verdana"];
  let result = renderSmileys(text);
  const styles = [
    ["b", "strong"], ["i", "em"], ["s", "del"]
  ];
  for (const [tag, html] of styles) {
    const re = new RegExp("\\[" + tag + "\\]([\\s\\S]*?)\\[\\/" + tag + "\\]", "gi");
    result = result.replace(re, "<" + html + ">$1</" + html + ">");
  }
  result = result.replace(/\[size=([1-5])\]([\s\S]*?)\[\/size\]/gi,
    (_, n, content) => '<span class="forum-size-' + n + '">' + content + '</span>');
  result = result.replace(/\[color=(#[0-9a-f]{6})\]([\s\S]*?)\[\/color\]/gi,
    (whole, color, content) => colors.includes(color.toLowerCase()) ?
      '<span style="color:' + color + '">' + content + '</span>' : whole);
  result = result.replace(/\[font=([1-5])\]([\s\S]*?)\[\/font\]/gi,
    (_, n, content) => '<span style="font-family:' + fonts[Number(n)-1] + '">' + content + '</span>');
  result = result.replace(/\[align=(left|center|right)\]([\s\S]*?)\[\/align\]/gi,
    (_, alignment, content) => '<div style="text-align:' + alignment + '">' + content + '</div>');
  result = result.replace(/\[url=(https?:\/\/[^\]\s]{1,500})\]([\s\S]*?)\[\/url\]/gi,
    (_, url, label) => '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer nofollow">' + label + '</a>');
  return result;
}
function renderForumMessage(text) {
  const source = String(text || "");
  const parts = [];
  const pattern = /\[quote(?:=([^\]\r\n]{1,80}))?\]([\s\S]*?)\[\/quote\]/gi;
  let cursor = 0, match;
  while ((match = pattern.exec(source)) !== null) {
    parts.push('<span>' + renderInlineMarkup(source.slice(cursor, match.index).replace(/\n+$/, "")) + '</span>');
    const author = (match[1] || "").trim().replace(/^["']|["']$/g, "");
    parts.push('<blockquote class="forum-quote"><strong>' +
      (author ? esc(author) + ' a écrit :' : 'Citation :') +
      '</strong><div>' + renderInlineMarkup(match[2].trim()) + '</div></blockquote>');
    cursor = pattern.lastIndex;
  }
  parts.push('<span>' + renderInlineMarkup(source.slice(cursor).replace(/^\n+/, "")) + '</span>');
  return parts.join("");
}

function setupSmileysPicker() {
  const toggle = document.getElementById("smileys-toggle");
  const picker = document.getElementById("smileys-picker");
  const close = document.getElementById("smileys-close");
  const grid = document.getElementById("smileys-grid");
  const textarea = document.getElementById("reply-body");
  if (!toggle || !picker || !close || !grid || !textarea) return;
  let gridInitialized = false;
  toggle.addEventListener("click", () => {
    if (!gridInitialized) {
      const names = Object.keys(SMILEYS);
      grid.innerHTML = names.length
        ? names.map(key => '<button class="smiley-choice" type="button" data-smiley="' + key +
            '" title="' + key.replace(/_/g, " ") + '"><img src="' + SMILEYS[key] + '" alt="' + key + '" loading="lazy" decoding="async"></button>').join("")
        : '<p>Les fichiers des smileys ne sont pas encore disponibles.</p>';
      gridInitialized = true;
    }
    picker.hidden = !picker.hidden;
    toggle.setAttribute("aria-expanded", String(!picker.hidden));
  });
  close.addEventListener("click", () => {
    picker.hidden = true;
    toggle.setAttribute("aria-expanded", "false");
    toggle.focus();
  });
  grid.addEventListener("click", event => {
    const button = event.target.closest("[data-smiley]");
    if (!button) return;
    const token = "[smiley:" + button.dataset.smiley + "]";
    textarea.focus();
    const selection = window.getSelection();
    let range = selection && selection.rangeCount ? selection.getRangeAt(0) : null;
    if (!range || !textarea.contains(range.commonAncestorContainer)) {
      range = document.createRange();
      range.selectNodeContents(textarea);
      range.collapse(false);
    }
    range.deleteContents();
    const img = document.createElement("img");
    img.className = "reply-editor-smiley";
    img.src = SMILEYS[button.dataset.smiley];
    img.alt = "Smiley " + button.dataset.smiley;
    img.dataset.smiley = button.dataset.smiley;
    img.contentEditable = "false";
    range.insertNode(img);
    range.setStartAfter(img);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !picker.hidden) {
      picker.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
      toggle.focus();
    }
  });
}

// ============================================================
// DATE
// ============================================================

function formatDate(value) {

  if (!value) {
    return "";
  }

  return new Intl.DateTimeFormat(
    "fr-FR",
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  ).format(new Date(value));
}


// ============================================================
// MEMBRE CONNECTÉ
// ============================================================

async function renderMember() {

  const profile =
    await getCurrentProfile();


  if (!profile) {

    memberArea.innerHTML = `
      <p>
        <a href="connexion.html">
          Connexion / Créer un compte
        </a>
      </p>
    `;

    return;
  }


  memberArea.innerHTML = `
    <p>
      Connecté :
      <strong>${esc(profile.username)}</strong>
      —
      <button
        type="button"
        id="logout-button"
      >
        Se déconnecter
      </button>
    </p>
  `;


  document
    .getElementById("logout-button")
    .addEventListener(
      "click",
      logout
    );
}


// ============================================================
// CHARGEMENT DU SUJET
// ============================================================

async function getThread() {

  if (!Number.isInteger(id) || id <= 0) {
    return null;
  }


  const { data, error } =
    await window.supabaseClient
      .from("threads")
      .select(`
        id,
        category_id,
        user_id,
        title,
        is_locked,
        is_pinned,
        created_at,
        updated_at
      `)
      .eq("id", id)
      .single();


  if (error) {

    console.error(
      "Erreur chargement sujet :",
      error
    );

    return null;
  }


  return data;
}


// ============================================================
// UN MESSAGE
// ============================================================

function messageHtml(post, isFirstMessage = false, title = "", messageCount = 0, signature = "", isAdmin = false) {

  const avatar = post.avatar_url
    ? `<img class="post-avatar" src="${esc(post.avatar_url)}" alt="Avatar de ${esc(post.author || "Membre")}" loading="lazy">`
    : `<div class="post-avatar post-avatar-default" aria-hidden="true">${esc((post.author || "M").charAt(0).toUpperCase())}</div>`;

  return `
    <article class="forum-post" id="post-${post.id}">

      <div class="post-author">
        ${avatar}
        <strong>${esc(post.author || "Membre")}</strong>
        <span class="post-message-count">${messageCount} message${messageCount > 1 ? "s" : ""}</span>
      </div>

      <div class="post-content">

      ${
        isFirstMessage
          ? `<h2>${esc(title)}</h2>`
          : ""
      }

      <div class="forum-message-head">
        <div class="count">
          Par <strong>${esc(post.author || "Membre")}</strong>
          ${post.created_at ? " — " + esc(formatDate(post.created_at)) : ""}
        </div>
        <button class="btn forum-quote-action" type="button" data-quote-post="${post.id}">Citer</button>
      </div>

      <div class="forum-message-body">${renderForumMessage(post.body)}</div>

      ${signature ? `<div class="post-signature">${esc(signature)}</div>` : ""}\n
      ${isAdmin ? `<div class="admin-post-actions"><button class="btn admin-delete-post" type="button" data-post-id="${post.id}">Supprimer ce message</button></div>` : ""}

      </div>
    </article>
  `;
}


// ============================================================
// AFFICHAGE DU SUJET
// ============================================================

async function renderSubject() {

  const user = await getCurrentUser();

  if (!user) {
    document.title = "Accès réservé aux membres — Heroscape France";
    subjectBox.innerHTML = `
      <section class="card">
        <h2>🔒 Discussion réservée aux membres</h2>
        <p>Le contenu des sujets et les discussions du forum sont réservés aux membres connectés.</p>
        <p>Pour consulter ce sujet, inscris-toi au forum ou connecte-toi. Nous t'encourageons également à participer de temps en temps aux discussions afin de faire vivre la communauté Heroscape France.</p>
        <p><a class="btn" href="connexion.html">Connexion / Créer un compte</a></p>
      </section>
    `;
    return;
  }

  const thread =
    await getThread();


  if (!thread) {

    subjectBox.innerHTML =
      '<div class="empty">Sujet introuvable.</div>';

    return;
  }


  document.title =
    thread.title + " — Heroscape France";

  // Le sujet n'est marqué lu qu'après récupération de ses messages,
  // afin d'enregistrer exactement la date du dernier message réellement affiché.


  const slug = await catSlug(thread.category_id);

  if (slug) {
    backLink.href =
      "categorie.html?cat=" +
      encodeURIComponent(slug);

    backLink.textContent =
      "← Retour à " +
      await catName(slug);
  }


  const currentProfile = await getCurrentProfile();
  const isAdmin = currentProfile?.role === "admin";
  const posts = await getReplies(id);
  const latestPost = posts.length ? posts[posts.length - 1] : null;
  await markThreadRead(id, latestPost?.created_at || thread.updated_at || thread.created_at);
  const messageCounts = await getMessageCounts();
  const signatures = await getSignatures(posts.map(post => post.user_id));
  const totalPages = Math.max(1, Math.ceil(posts.length / POSTS_PER_PAGE));
  const currentPage = Math.min(page, totalPages);
  const start = (currentPage - 1) * POSTS_PER_PAGE;
  const pagePosts = posts.slice(start, start + POSTS_PER_PAGE);

  let firstPostHtml = "";
  let repliesHtml = "";

  if (posts.length) {
    if (currentPage === 1 && pagePosts.length) {
      firstPostHtml = messageHtml(
        pagePosts[0], true, thread.title,
        messageCounts[pagePosts[0].user_id] || 0,
        signatures[pagePosts[0].user_id] || "",
        isAdmin
      );
    } else {
      firstPostHtml = '<h2 class="thread-page-title">' + esc(thread.title) + '</h2>';
    }

    const visibleReplies = currentPage === 1 ? pagePosts.slice(1) : pagePosts;
    repliesHtml = visibleReplies.length
      ? visibleReplies.map(post =>
          messageHtml(post, false, "", messageCounts[post.user_id] || 0, signatures[post.user_id] || "", isAdmin)
        ).join("")
      : '<div class="empty">Aucune réponse sur cette page.</div>';

  } else {

    firstPostHtml = `
      <article>

        <h2>
          ${esc(thread.title)}
        </h2>

        <div class="empty">
          Aucun message dans ce sujet.
        </div>

      </article>
    `;


    repliesHtml = `
      <div class="empty">
        Aucune réponse pour le moment.
      </div>
    `;
  }


  let replyFormHtml = "";


  if (thread.is_locked) {

    replyFormHtml = `
      <div class="empty">
        🔒 Ce sujet est verrouillé.
      </div>
    `;

  } else if (!user) {

    replyFormHtml = `
      <div class="card">

        <h3>Participer à la discussion</h3>

        <p>
          Tu dois être connecté pour répondre.
        </p>

        <p>
          <a
            class="btn"
            href="connexion.html"
          >
            Connexion / Créer un compte
          </a>
        </p>

      </div>
    `;

  } else {

    replyFormHtml = `
      <div class="card">

        <h3>Répondre</h3>

        <div
          id="reply-body"
          class="reply-rich-editor"
          contenteditable="true"
          role="textbox"
          aria-multiline="true"
          data-placeholder="Écris ta réponse…"
        ></div>

        <div class="smileys-toolbar">\n          <button class="btn" id="insert-quote" type="button">❝ Citation</button>
          <button class="btn" id="smileys-toggle" type="button" aria-expanded="false" aria-controls="smileys-picker">😊 Smileys</button>
          <div class="smileys-picker" id="smileys-picker" hidden>
            <div class="smileys-picker-head"><strong>Choisir un smiley</strong><button type="button" id="smileys-close" aria-label="Fermer les smileys">×</button></div>
            <div class="smileys-grid" id="smileys-grid"></div>
          </div>
        </div>

        <p>
          <button
            class="btn"
            id="reply-button"
            type="button"
          >
            Publier la réponse
          </button>
        </p>

        <p id="reply-message"></p>

      </div>
    `;
  }


  const paginationHtml = totalPages > 1 ? `<nav class="pagination" aria-label="Pages du sujet">${Array.from({length:totalPages},(_,i)=>i+1).map(n => `<a class="${n===currentPage ? "active" : ""}" href="sujet.html?id=${id}&page=${n}">${n}</a>`).join("")}</nav>` : "";

  subjectBox.innerHTML = `

    ${paginationHtml}
    ${isAdmin ? '<div class="admin-thread-actions"><button class="btn" id="admin-delete-thread" type="button">Supprimer ce sujet</button></div>' : ""}
    ${firstPostHtml}

    <h3>Réponses</h3>

    <div id="replies">
      ${repliesHtml}
    </div>

    ${paginationHtml}
    ${replyFormHtml}

  `;


  if (isAdmin) {
    const deleteThreadButton = document.getElementById("admin-delete-thread");
    if (deleteThreadButton) {
      deleteThreadButton.addEventListener("click", async () => {
        if (!confirm("Êtes-vous sûr de vouloir supprimer ce sujet ?")) return;
        deleteThreadButton.disabled = true;
        const { error } = await window.supabaseClient.rpc("admin_delete_forum_thread", { p_thread_id: id });
        if (error) {
          alert("Suppression impossible : " + error.message);
          deleteThreadButton.disabled = false;
          return;
        }
        location.href = backLink.href;
      });
    }

    subjectBox.querySelectorAll(".admin-delete-post").forEach(button => {
      button.addEventListener("click", async () => {
        if (!confirm("Êtes-vous sûr de vouloir supprimer ce message ?")) return;
        button.disabled = true;
        const { error } = await window.supabaseClient.rpc("admin_delete_forum_post", { p_post_id: Number(button.dataset.postId) });
        if (error) {
          alert("Suppression impossible : " + error.message);
          button.disabled = false;
          return;
        }
        location.reload();
      });
    });
  }

  if (user && !thread.is_locked) {

    setupSmileysPicker();
    const editor = document.getElementById("reply-body");
    function insertQuote(author, content) {
      const safeAuthor = String(author || "").replace(/[\[\]\r\n]/g, "").slice(0, 80);
      const quotedText = String(content || "").replace(/\[\/quote\]/gi, "[/ citation ]");
      const quote = "[quote" + (safeAuthor ? "=" + safeAuthor : "") + "]\n" +
        quotedText + "\n[/quote]\n";
      editor.focus();
      const selection = window.getSelection();
      let range = selection && selection.rangeCount ? selection.getRangeAt(0) : null;
      if (!range || !editor.contains(range.commonAncestorContainer)) {
        range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
      }
      range.deleteContents();
      const node = document.createTextNode(quote);
      range.insertNode(node);
      range.setStartAfter(node);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      editor.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function wrapSelection(open, close, placeholder = "texte") {
      editor.focus();
      const selection = window.getSelection();
      let range = selection && selection.rangeCount ? selection.getRangeAt(0) : null;
      if (!range || !editor.contains(range.commonAncestorContainer)) {
        range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
      }
      const selected = range.toString() || placeholder;
      range.deleteContents();
      const node = document.createTextNode(open + selected + close);
      range.insertNode(node);
      range.setStartAfter(node);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
    }
    document.querySelectorAll("#forum-format-toolbar [data-format]").forEach(button => {
      button.addEventListener("click", () => wrapSelection("[" + button.dataset.format + "]", "[/" + button.dataset.format + "]"));
    });
    for (const [id, tag] of [["forum-size","size"],["forum-font","font"],["forum-color","color"]]) {
      document.getElementById(id)?.addEventListener("change", event => {
        if (event.target.value) wrapSelection("[" + tag + "=" + event.target.value + "]", "[/" + tag + "]");
        event.target.value = "";
      });
    }
    document.querySelectorAll("#forum-format-toolbar [data-align]").forEach(button => {
      button.addEventListener("click", () => wrapSelection("[align=" + button.dataset.align + "]", "[/align]"));
    });
    document.getElementById("forum-link")?.addEventListener("click", () => {
      const url = prompt("Adresse du lien (https://...) :");
      if (!url || !/^https?:\/\/\S+$/i.test(url) || url.length > 500) return;
      const label = prompt("Texte à afficher pour le lien :", url);
      if (label === null) return;
      wrapSelection("[url=" + url + "]", "[/url]", label || url);
    });
    document.getElementById("insert-quote")?.addEventListener("click", () => insertQuote("", ""));
    subjectBox.querySelectorAll("[data-quote-post]").forEach(button => {
      button.addEventListener("click", () => {
        const post = posts.find(item => String(item.id) === button.dataset.quotePost);
        if (post) insertQuote(post.author, post.body);
      });
    });

    document
      .getElementById("reply-button")
      .addEventListener(
        "click",
        publishReply
      );
  }
}


// ============================================================
// PUBLIER UNE RÉPONSE
// ============================================================

async function publishReply() {

  const replyBody =
    document.getElementById(
      "reply-body"
    );

  const replyButton =
    document.getElementById(
      "reply-button"
    );

  const replyMessage =
    document.getElementById(
      "reply-message"
    );


  const clone = replyBody.cloneNode(true);
  clone.querySelectorAll("img[data-smiley]").forEach(img => {
    img.replaceWith(document.createTextNode("[smiley:" + img.dataset.smiley + "]"));
  });
  clone.querySelectorAll("br").forEach(br => br.replaceWith(document.createTextNode("\n")));
  clone.querySelectorAll("div").forEach(div => {
    if (div !== clone) div.insertAdjacentText("beforebegin", "\n");
  });
  const body = clone.textContent.trim();


  if (!body) {

    replyMessage.textContent =
      "Écris une réponse avant de publier.";

    return;
  }


  replyButton.disabled = true;

  replyMessage.textContent =
    "Publication en cours…";


  const result =
    await addReply(
      id,
      null,
      body
    );


  if (!result) {

    replyMessage.textContent =
      "Impossible d'enregistrer la réponse.";

    replyButton.disabled = false;

    return;
  }


  const postsAfter = await getReplies(id);
  const lastPage = Math.max(1, Math.ceil(postsAfter.length / POSTS_PER_PAGE));
  location.href = "sujet.html?id=" + id + "&page=" + lastPage;
}


// ============================================================
// DÉMARRAGE
// ============================================================

renderMember();

renderSubject();

</script>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sujet — Heroscape France</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="container"><div class="brand"><div class="logo">HS</div><div><h1>Heroscape France</h1><div class="tag">Forum & archives francophones</div></div></div>
<nav><a class="active" href="index.html">Forum</a><a href="cartes-armee.html">Cartes d'armée</a><a href="regles.html">Règles</a></nav></div></header>
<main class="container"><div class="hero"><a href="index.html">← Forum</a></div><div id="subject"></div></main><footer><div class="container">Heroscape France</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
const id = Number(new URLSearchParams(location.search).get("id"));

async function renderSubject() {
  const { data: topic, error } = await window.supabaseClient
    .from("topics")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !topic) {
    console.error(error);
    document.getElementById("subject").innerHTML =
      '<div class="empty">Sujet introuvable.</div>';
    return;
  }

  document.title = topic.title + " – Heroscape France";

  const { data: replies, error: repliesError } = await window.supabaseClient
    .from("replies")
    .select("*")
    .eq("topic_id", id)
    .order("created_at", { ascending: true });

  if (repliesError) {
    console.error(repliesError);
  }

  const repliesHtml = (replies || []).map(r => `
    <article>
      <div class="count">Par ${esc(r.author || "Visiteur")}</div>
      <p>${esc(r.body)}</p>
    </article>
  `).join("");

  document.getElementById("subject").innerHTML = `
    <article>
      <h2>${esc(topic.title)}</h2>
      <div class="count">Par ${esc(topic.author || "Visiteur")}</div>
      <p>${esc(topic.body)}</p>
    </article>

    <h3>Réponses</h3>

    <div id="replies">
      ${repliesHtml || '<div class="empty">Aucune réponse pour le moment.</div>'}
    </div>

    <p>
      <button class="btn" onclick="reply()">Répondre</button>
    </p>
  `;
}

async function reply() {
  const author = prompt("Votre pseudo :", "Visiteur") || "Visiteur";
  const body = prompt("Votre réponse :");

  if (!body) return;

  const { error } = await window.supabaseClient
    .from("replies")
    .insert({
      topic_id: id,
      author: author,
      body: body
    });

  if (error) {
    console.error(error);
    alert("Impossible d'enregistrer la réponse.");
    return;
  }

  await renderSubject();
}

renderSubject();
</script>
</body>
</html>
